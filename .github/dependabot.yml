version: 2
updates:
  # Root workspace dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      # Group all non-major updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Group security updates separately for faster merging
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # API app dependencies
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
        update-types:
          - "minor"
          - "patch"
      express-middleware:
        patterns:
          - "express*"
          - "cors"
          - "helmet"
        update-types:
          - "patch"
    labels:
      - "dependencies"
      - "api"
      - "automated"

  # Web app dependencies
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "web"
      - "automated"

  # CMS app dependencies
  - package-ecosystem: "npm"
    directory: "/apps/cms"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      strapi:
        patterns:
          - "@strapi/*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "cms"
      - "automated"

  # Shared package dependencies
  - package-ecosystem: "npm"
    directory: "/packages/shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "shared"
      - "automated"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    labels:
      - "docker"
      - "api"
      - "automated"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    labels:
      - "docker"
      - "web"
      - "automated"

  - package-ecosystem: "docker"
    directory: "/apps/cms"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    labels:
      - "docker"
      - "cms"
      - "automated"

  # Helm chart dependencies
  - package-ecosystem: "helm"
    directory: "/deploy/k8s/charts/mevn-stack"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
    labels:
      - "dependencies"
      - "helm"
      - "automated"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
    labels:
      - "github-actions"
      - "automated"
