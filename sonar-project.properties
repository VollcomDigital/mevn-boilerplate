# SonarQube Project Configuration
sonar.projectKey=vollcomdigital_mevn-boilerplate
sonar.organization=vollcomdigital

# Project Metadata
sonar.projectName=MEVN Cloud Native Monorepo
sonar.projectVersion=0.1.0

# Source Configuration
sonar.sources=apps,packages
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/dist/**,\
  **/build/**,\
  **/.output/**,\
  **/.nuxt/**,\
  **/.turbo/**,\
  **/.cache/**,\
  **/.strapi/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/pnpm-lock.yaml,\
  **/package-lock.json

# Test Configuration (when tests are added)
# sonar.tests=apps,packages
# sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Coverage Configuration (when coverage is added)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Language-Specific Settings
sonar.javascript.node.maxspace=4096
sonar.typescript.node.maxspace=4096

# Quality Gate Settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Duplication Detection
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/Dockerfile

# Security Hotspot Detection
sonar.security.hotspots.enabled=true
