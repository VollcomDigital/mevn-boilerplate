# Kubernetes Secrets Template
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Replace all placeholder values with actual base64-encoded secrets
# 3. Apply: kubectl apply -f secrets.yaml
# 4. NEVER commit secrets.yaml to version control (it's in .gitignore)

apiVersion: v1
kind: Secret
metadata:
  name: mevn-api-secrets
  namespace: default
type: Opaque
data:
  # Generate with: echo -n "your-secret-here" | base64
  session-secret: <BASE64_ENCODED_SESSION_SECRET>
  # Example: openssl rand -base64 32 | base64

---
apiVersion: v1
kind: Secret
metadata:
  name: mevn-cms-secrets
  namespace: default
type: Opaque
data:
  # Generate with: echo -n "key1,key2,key3,key4" | base64
  app-keys: <BASE64_ENCODED_STRAPI_APP_KEYS>
  # Generate with: echo -n "your-salt" | base64
  api-token-salt: <BASE64_ENCODED_API_TOKEN_SALT>
  admin-jwt-secret: <BASE64_ENCODED_ADMIN_JWT_SECRET>
  transfer-token-salt: <BASE64_ENCODED_TRANSFER_TOKEN_SALT>
  jwt-secret: <BASE64_ENCODED_JWT_SECRET>

---
apiVersion: v1
kind: Secret
metadata:
  name: mevn-database-secrets
  namespace: default
type: Opaque
data:
  # Example: echo -n "mongodb://user:pass@host:27017/db" | base64
  mongo-uri: <BASE64_ENCODED_MONGO_URI>
  # Example: echo -n "redis://user:pass@host:6379" | base64
  redis-url: <BASE64_ENCODED_REDIS_URL>

---
# Example of how to generate secrets:
# SESSION_SECRET=$(openssl rand -base64 32)
# echo -n "$SESSION_SECRET" | base64
#
# Or use kubectl to create directly:
# kubectl create secret generic mevn-api-secrets \
#   --from-literal=session-secret=$(openssl rand -base64 32) \
#   --dry-run=client -o yaml > secrets.yaml
