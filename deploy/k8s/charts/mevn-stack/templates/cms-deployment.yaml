{{- if .Values.cms.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mevn-stack.fullname" . }}-cms
  labels:
    {{- include "mevn-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: cms
spec:
  replicas: {{ .Values.cms.replicaCount }}
  selector:
    matchLabels:
      {{- include "mevn-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cms
  template:
    metadata:
      labels:
        {{- include "mevn-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cms
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: cms
          image: "{{ .Values.cms.image.repository }}:{{ .Values.cms.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cms.containerPort }}
          env:
            - name: NODE_ENV
              value: {{ .Values.global.nodeEnv | quote }}
            - name: STRAPI_HOST
              value: "0.0.0.0"
            - name: STRAPI_PORT
              value: {{ .Values.cms.containerPort | quote }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.cms.resources | nindent 12 }}
{{- end }}
