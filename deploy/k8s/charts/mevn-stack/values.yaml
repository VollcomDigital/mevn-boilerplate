global:
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  nodeEnv: production
  mongoUri: mongodb://mongodb:27017/mevn
  redisUrl: redis://redis-master:6379
  otelEndpoint: http://otel-collector:4318

web:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/your-org/mevn-web
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  containerPort: 3000
  probes:
    liveness:
      path: /api/health/live
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /api/health/ready
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 768Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  env: {}

api:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/your-org/mevn-api
    tag: latest
  service:
    type: ClusterIP
    port: 4000
  containerPort: 4000
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 768Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  env:
    API_HOST: 0.0.0.0
    API_PORT: "4000"
    OTEL_SERVICE_NAME: mevn-api
    TRUST_PROXY: "1"
    ALLOWED_ORIGINS: https://app.example.com
    SESSION_SECRET: replace-via-secret

cms:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/your-org/mevn-cms
    tag: latest
  service:
    type: ClusterIP
    port: 1337
  containerPort: 1337
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
